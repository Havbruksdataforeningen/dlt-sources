# Release one workspace package to PyPI, triggered by pushing a tag like
# dlt-source-aquabyte/v0.2.0. Final versions go to PyPI, pre-release versions
# to TestPyPI. How-to and rules: docs/release.md.

name: Release

on:
  push:
    tags:
      # `*` does not match `/`, so this is an exact <package>/v<version> selector.
      - "dlt-source-*/v*"

# Least privilege by default; each job opts back in to what it needs.
permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Split "<package>/v<version>" once, and let `packaging` classify the
      # version. Handles rc1 / b2 / a1 / .dev1 / .post1 correctly.
      - name: Parse tag
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="${REF_NAME%%/*}"
          version="${REF_NAME#*/v}"
          if [ "$package" = "$REF_NAME" ] || [ "$version" = "$REF_NAME" ]; then
            echo "::error::Tag '$REF_NAME' is not of the form <package>/v<version>"
            exit 1
          fi
          prerelease="$(uv run --no-project --with packaging -- python -c \
            'import sys; from packaging.version import Version; print(str(Version(sys.argv[1]).is_prerelease).lower())' \
            "$version")"
          {
            echo "package=$package"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${package} ${version} (prerelease=${prerelease})"

      # The guard that makes the tag trustworthy: the tag must agree with the
      # version declared in the package's pyproject.toml. Without this, tagging
      # v0.3.0 while pyproject still says 0.1.0 publishes the wrong version
      # irrevocably — PyPI never allows reuse of a version number.
      #
      # Compared as PEP 440 values, so `v0.2.0-rc1` and `0.2.0rc1` compare equal.
      # encode/httpx guards the same way in scripts/publish.
      - name: Assert tag matches declared version
        env:
          PACKAGE: ${{ steps.meta.outputs.package }}
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          declared="$(uv version --package "$PACKAGE" --short --frozen)"
          uv run --no-project --with packaging -- python -c \
            'import sys; from packaging.version import Version; tag, dec = sys.argv[1:3]; sys.exit(f"::error::tag version {tag!r} != pyproject version {dec!r}") if Version(tag) != Version(dec) else print(f"OK: tag {tag} matches pyproject {dec}")' \
            "$TAG_VERSION" "$declared"

      # A final release must have its changelog entry (docs/release.md,
      # step 3). Release candidates are tagged before the entry is written, so
      # pre-release versions skip this check.
      - name: Assert changelog has this version
        if: steps.meta.outputs.prerelease == 'false'
        env:
          PACKAGE: ${{ steps.meta.outputs.package }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if grep -qF "## [${VERSION}]" "packages/${PACKAGE}/CHANGELOG.md"; then
            echo "OK: changelog has a section for ${VERSION}"
          else
            echo "::error::packages/${PACKAGE}/CHANGELOG.md has no '## [${VERSION}]' section. Write the changelog entry before tagging — docs/release.md, step 3."
            exit 1
          fi

      # --no-sources builds the package as a consumer would get it, with
      # tool.uv.sources workspace redirects disabled — so a workspace-internal
      # dependency that would not resolve from PyPI fails here, not downstream.
      - name: Build
        run: uv build --package "${{ steps.meta.outputs.package }}" --no-sources

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Pre-release versions -> TestPyPI. No approval; this is the test release.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ needs.build.outputs.package }}
    permissions:
      # Mandatory for Trusted Publishing. Job level, never workflow level.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  # Final versions -> PyPI, behind required reviewers on the `pypi` environment.
  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Generates and uploads PEP 740 attestations by default, and runs a
      # metadata check before upload. No token, no stored secret.
      # Pinned by SHA rather than tag: this step holds the publishing identity.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
