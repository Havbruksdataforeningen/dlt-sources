# Pull-request and main-branch quality gate.
#
# Shape and rationale: docs/testing.md.
#
# The checks run in parallel, each named for what it checks, so one push
# reports every kind of failure at once. Every job loops over every package —
# there are few enough that computing which ones changed is not worth it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per branch. A force-push supersedes the previous run instead
# of racing it. Never cancel on main — those runs are the record of what landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # --locked fails if uv.lock is stale rather than silently resolving
      # something different from what a developer tested against.
      - run: uv sync --all-packages --all-groups --locked
      - name: ruff format --check
        run: |
          set -euo pipefail
          for d in packages/*/; do
            echo "::group::${d}"
            paths=""
            for p in src tests examples; do
              if [ -d "${d}${p}" ]; then paths="${paths} ${p}"; fi
            done
            (cd "${d}" && uv run ruff format --check ${paths})
            echo "::endgroup::"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-groups --locked
      - name: ruff check
        run: |
          set -euo pipefail
          for d in packages/*/; do
            echo "::group::${d}"
            paths=""
            for p in src tests examples; do
              if [ -d "${d}${p}" ]; then paths="${paths} ${p}"; fi
            done
            (cd "${d}" && uv run ruff check --output-format=github ${paths})
            echo "::endgroup::"
          done

  typecheck:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-groups --locked
      # src AND tests. For a connector the mapping assertions live in the tests,
      # so excluding them leaves the most schema-sensitive code unchecked.
      # The pyright version is pinned in each package's dev dependency group and
      # bumped deliberately — it ships weekly and new diagnostics turn unrelated
      # PRs red.
      - name: pyright
        run: |
          set -euo pipefail
          for d in packages/*/; do
            echo "::group::${d}"
            (cd "${d}" && uv run pyright)
            echo "::endgroup::"
          done

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Floor and ceiling of the supported range. Testing every minor in between
      # buys little for pure-Python packages with no compiled dependencies; a
      # break almost always shows at one end or the other.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-packages --all-groups --locked
      # No filter flags here on purpose. Tests are offline by default, and a
      # package that has optional live tests excludes them in its own addopts.
      # So this command means the same thing here and on a laptop.
      # Coverage is printed, never enforced — see docs/testing.md.
      - name: pytest
        run: |
          set -euo pipefail
          for d in packages/*/; do
            echo "::group::${d}"
            (cd "${d}" && uv run pytest --cov --cov-report=term-missing)
            echo "::endgroup::"
          done

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # Every package must build on every PR. A packaging error found at release
      # time is found at the worst possible moment; this makes a green PR mean
      # "publishable", which is the whole point of the gate.
      # --no-sources matches the release build exactly: workspace redirects
      # disabled, so the package builds as a PyPI consumer would get it.
      - name: uv build
        run: |
          set -euo pipefail
          for d in packages/*/; do
            pkg="$(basename "${d}")"
            echo "::group::${pkg}"
            uv build --package "${pkg}" --no-sources
            echo "::endgroup::"
          done

  # Single required status check. Branch protection lists ONLY this job, so
  # adding or renaming a job above never requires touching repo settings — and a
  # skipped or cancelled dependency can never be mistaken for a pass, which is
  # the classic path-filtering trap. The `always()` + explicit result test is
  # what makes that work: without it this job would be skipped, not failed,
  # when a dependency fails.
  ci-ok:
    name: CI OK
    if: always()
    needs: [format, lint, typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more required checks did not succeed."
          exit 1
      - run: echo "All checks passed."
