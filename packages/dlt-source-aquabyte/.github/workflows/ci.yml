name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check src/ tests/ examples/

      - name: Lint
        run: uv run ruff check src/ tests/ examples/

      - name: Type check
        run: uv run pyright

      - name: Security scan
        run: uv run bandit -r src/ -c pyproject.toml

      - name: Unit tests
        run: uv run python -m pytest -m "not integration" --cov=dlt_source_aquabyte --cov-report=term-missing

  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Generate .dlt/config.toml
        run: cp .dlt/config.toml.example .dlt/config.toml

      - name: Generate .dlt/secrets.toml
        run: |
          mkdir -p .dlt
          printf '[sources.aquabyte]\napi_key = "%s"\n' "${{ secrets.AQUABYTE_API_KEY }}" > .dlt/secrets.toml

      - name: Run integration tests
        run: uv run python -m pytest -m integration --timeout=300 -v
