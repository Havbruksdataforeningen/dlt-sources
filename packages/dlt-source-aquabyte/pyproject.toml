[project]
name = "dlt-source-aquabyte"
version = "0.3.1"
description = "dlt source package for the Aquabyte API v3"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639: an SPDX expression plus the file, not a classifier. The two forms
# cannot be combined, so there is deliberately no "License ::" classifier below.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Havbruksdataforeningen" }]
keywords = ["dlt", "aquabyte", "aquaculture", "salmon", "etl", "elt", "data-ingestion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # >=1.2 for TScd2StrategyDict, which aquabyte.py imports.
    "dlt>=1.2",
]

[project.urls]
Homepage = "https://github.com/Havbruksdataforeningen/dlt-sources/tree/main/packages/dlt-source-aquabyte"
Repository = "https://github.com/Havbruksdataforeningen/dlt-sources"
Changelog = "https://github.com/Havbruksdataforeningen/dlt-sources/blob/main/packages/dlt-source-aquabyte/CHANGELOG.md"
Issues = "https://github.com/Havbruksdataforeningen/dlt-sources/issues"

[dependency-groups]
dev = [
    "dlt[duckdb]>=1.2",
    # tests/test_mock_fidelity.py validates the fixtures against specs/openapi.json,
    # which is JSON Schema. Hand-rolling that check was ~60 lines of subset validator.
    "jsonschema>=4",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pyright>=1.1",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

# Ships the PEP 561 marker, so a consumer's type checker reads this package's
# annotations instead of treating it as untyped.
[tool.setuptools.package-data]
dlt_source_aquabyte = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# S is ruff's port of bandit: hardcoded credentials, requests without a
# timeout, disabled TLS verification — the risks of code that talks to a
# supplier's API with credentials. It replaces bandit itself, which ran as a
# separate unenforced command until it was removed; don't add it back without
# a check it catches that S does not.
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert (S101) — that is what a test is. They also query their own
# local duckdb with f-string SQL (S608): table names cannot be bound as
# parameters, and the interpolated values are test constants.
"tests/**" = ["S101", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["dlt_source_aquabyte"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src", "tests", "examples"]
exclude = [".venv", ".dlt", ".agent"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is offline — it needs no Aquabyte credentials, so it means
# the same thing in CI and on a laptop. Run the live tests with -m integration.
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests that hit the real Aquabyte API (run with -m integration)",
]
filterwarnings = [
    "ignore::DeprecationWarning:dlt.extract.validation",
]

[build-system]
requires = ["setuptools>=77.0.3"]  # >=77 for PEP 639 license / license-files
build-backend = "setuptools.build_meta"
