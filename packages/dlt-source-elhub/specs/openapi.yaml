openapi: 3.1.0
info:
  title: Energy Data API
  description: "<b>V0: This API is currently accessible to the public, and we anticipate\
    \ future updates and enhancements.</b>"
  version: v0
externalDocs:
  url: /
servers: []
tags: []
paths:
  /energy-data/v0/meta/{entity}:
    get:
      tags:
      - Meta
      summary: Meta Endpoint for entity and dataset
      operationId: meta
      parameters:
      - name: entity
        in: path
        description: Entity type for which metadata is requested
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: price-areas
      responses:
        "200":
          description: Provides metadata
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/no.elhub.ds.energy.data.models.response.MetaResponse"
              examples:
                metaExample:
                  value: "{\"meta\":{\"created\":\"2026-09-29T15:38:15+02:00\",\"\
                    lastUpdated\":\"2026-09-29T15:38:15+02:00\"},\"links\":{\"self\"\
                    :\"https://api.elhub.no/energy-data/v0/meta/{entity}\"},\"data\"\
                    :{\"type\":\"entity\",\"id\":\"price-area\",\"attributes\":{\"\
                    description\":\"Metadata for price area\",\"noOfDataSets\":2}}}"
        "400":
          description: Invalid request parameters or entity
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                invalidEntity:
                  value: "{\"errors\":[{\"status\":\"400\",\"title\":\"Invalid query\
                    \ parameter\",\"detail\":\"The requested entity is invalid or\
                    \ unsupported.\",\"links\":{\"self\":\"https://api.elhub.no/energy-data/v0/meta/{entity}\"\
                    }}]}"
        "500":
          description: Unexpected server error
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                unexpectedError:
                  value: "{\"errors\":[{\"status\":\"500\",\"title\":\"Unexpected\
                    \ server error. Try again later.\",\"detail\":\"An unexpected\
                    \ error occurred on the server.\",\"links\":{\"self\":\"https://api.elhub.no/energy-data/v0/meta/{entity}\"\
                    }}]}"
      deprecated: false
  /energy-data/v0/parties:
    get:
      tags:
      - Party
      summary: Get list of parties
      operationId: parties
      parameters: []
      responses:
        "200":
          description: When request is valid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/no.elhub.ds.energy.data.models.response.PartyResponse"
              examples:
                PartyExample:
                  summary: PartyExample
                  value: "{\"meta\":{\"created\":\"2024-10-29T12:16:37+01:00\"},\"\
                    links\":{\"self\":\"api.elhub.no/energy-data/v0/parties\"},\"\
                    data\":[{\"type\":\"parties\",\"id\":\"String\",\"attributes\"\
                    :{\"gln\":\"String\",\"partyTypes\":[\"String\"],\"name\":\"String\"\
                    ,\"organisationNumber\":\"String\"},\"relationships\":{\"grid-area\"\
                    :{\"data\":[{\"type\":\"grid-areas\",\"id\":\"String\"}]}}},{\"\
                    type\":\"grid-areas\",\"id\":\"String\",\"attributes\":{\"name\"\
                    :\"String\",\"status\":\"String\",\"eic\":\"String\"},\"relationships\"\
                    :{\"price-area\":{\"data\":{\"type\":\"price-areas\",\"id\":\"\
                    String\"}}}},{\"type\":\"price-areas\",\"id\":\"String\",\"attributes\"\
                    :{\"name\":\"String\",\"eic\":\"String\",\"country\":\"String\"\
                    }}]}"
        "400":
          description: When the request is invalid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                Invalid request:
                  value: |-
                    {
                      "errors": [
                        {
                          "status": "400",
                          "title": "String",
                          "detail": "creationTime: 2024-10-28T14:15:45+01:00",
                          "links": {
                            "self": "https://api.elhub.no/energy-data/v0/parties"
                          }
                        }
                      ]
                    }
        "500":
          description: Unexpected server error
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/jsonapi.Error"
              examples:
                Unexpected server error:
                  value: |-
                    {
                      "errors": [
                        {
                          "status": "500",
                          "title": "String",
                          "detail": "creationTime: 2024-10-28T14:38:13+01:00"
                        }
                      ]
                    }
      deprecated: false
  /energy-data/v0/parties/{id}:
    get:
      tags:
      - Party
      summary: Get list of parties
      operationId: parties_id
      parameters:
      - name: id
        in: path
        description: A valid party id returned from /parties
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: "8000400000039"
      responses:
        "200":
          description: When request is valid
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/no.elhub.ds.energy.data.models.response.PartyResponse"
              examples:
                PartyExample:
                  summary: PartyExample
                  value: "{\"meta\":{\"created\":\"2024-10-29T12:16:37+01:00\"},\"\
                    links\":{\"self\":\"api.elhub.no/energy-data/v0/parties\"},\"\
                    data\":[{\"type\":\"parties\",\"id\":\"String\",\"attributes\"\
