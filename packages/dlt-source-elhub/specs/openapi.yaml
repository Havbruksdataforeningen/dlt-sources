  /energy-data/v0/price-areas:
    get:
      tags:
      - Price area
      summary: Get list of price areas and aggregations
      operationId: price_areas
      parameters:
      - name: dataset
        in: query
        description: The dataset name.
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: ConsumptionPerGroupMbaHour
      - name: startDate
        in: query
        description: "Start date (Format: yyyy-MM-dd'T'HH:mm:ssXXX at Europe/Oslo\
          \ timezone) of aggregated data (inclusive). If empty, it will be set to\
          \ a date one month in the past from endDate."
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: 2023-04-05T03:00:00+02:00
      - name: endDate
        in: query
        description: "End date (Format: yyyy-MM-dd'T'HH:mm:ssXXX at Europe/Oslo timezone)\
          \ of aggregated data (inclusive). The time period from startDate to endDate\
          \ cannot exceed one month. If empty, it will be set to current date and\
          \ startDate will be set to a date one month in the past."
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: 2023-04-15T03:00:00+02:00
      - name: consumptionGroup
        in: query
        description: The consumption group.
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: household
      - name: productionGroup
        in: query
        description: The production group.
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: hydro
      - name: estimatedAnnualConsumption
        in: query
        description: "The estimated annual consumption, integer between 1 and 500000"
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
        example: "10000"
      - name: Authorization
        in: header
        description: "Include the bearer token obtained from Maskinporten in the Authorization\
          \ header. Format: 'Bearer <token>'."
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: X-Elhub-GLN
        in: header
        description: Sender (Own) GLN value
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: On-Behalf-Of
        in: header
        description: GLN value of the onbehalf party
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          description: When request is OK. Choose a different dataset under 'Examples'
            to see different responses
          headers: {}
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/no.elhub.ds.energy.data.models.response.PriceAreaResponse"
              examples:
                '[No dataset chosen]':
                  value: "{\"meta\":{\"created\":\"2023-10-01T12:00:00+02:00\",\"\
                    lastUpdated\":\"2023-10-18T12:00:00+02:00\"},\"links\":{\"self\"\
                    :\"https://api.elhub.no/energy-data/v0/price-areas\"},\"data\"\
                    :[{\"type\":\"price-areas\",\"id\":\"NO1\",\"attributes\":{\"\
                    name\":\"NO5\",\"eic\":\"String\",\"country\":\"NO\"}}]}"
                CompletenessDailyPerMba:
                  value: "{\"meta\":{\"created\":\"2023-10-01T12:00:00+02:00\",\"\
                    lastUpdated\":\"2023-10-18T12:00:00+02:00\"},\"links\":{\"self\"\
                    :\"https://api.elhub.no/energy-data/v0/price-areas?dataset=CompletenessDailyPerMba\"\
                    },\"data\":[{\"type\":\"price-areas\",\"id\":\"NO1\",\"attributes\"\
                    :{\"name\":\"NO5\",\"eic\":\"String\",\"country\":\"NO\",\"CompletenessDailyPerMba\"\
                    :[{\"actualIntervalCount\":\"Int\",\"combinedConsumptionActualIntervalCount\"\
                    :\"Int\",\"combinedConsumptionExpectedIntervalCount\":\"Int\"\
                    ,\"combinedProductionActualIntervalCount\":\"Int\",\"combinedProductionExpectedIntervalCount\"\
                    :\"Int\",\"consumptionFifteenActualIntervalCount\":\"Int\",\"\
                    consumptionFifteenExpectedIntervalCount\":\"Int\",\"consumptionSixtyActualIntervalCount\"\
                    :\"Int\",\"consumptionSixtyExpectedIntervalCount\":\"Int\",\"\
                    estimatedAnnualConsumptionAll\":\"Long\",\"estimatedAnnualConsumptionCompleted\"\
                    :\"Long\",\"estimatedIntervalCount\":\"Int\",\"exchangeActualIntervalCount\"\
                    :\"Int\",\"exchangeExpectedIntervalCount\":\"Int\",\"expectedIntervalCount\"\
                    :\"Int\",\"finalEstimatedIntervalCount\":\"Int\",\"installedCapacityAll\"\
                    :\"Long\",\"installedCapacityCompleted\":\"Long\",\"largeProductionActualIntervalCount\"\
                    :\"Int\",\"largeProductionExpectedIntervalCount\":\"Int\",\"lastUpdatedTime\"\
                    :\"String\",\"loadLimitAll\":\"Long\",\"loadLimitCompleted\":\"\
                    Long\",\"meteredIntervalCount\":\"Int\",\"meteringPointCount\"\
                    :\"Int\",\"notCompleteMeteringPointCount\":\"Int\",\"priceArea\"\
                    :\"String\",\"temporaryIntervalCount\":\"Int\",\"usageDateId\"\
                    :\"Int\"}]}}]}"
                ConsumptionPerGroupMbaHour:
