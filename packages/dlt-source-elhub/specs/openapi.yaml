          description: The quantity in kWh for the metering value.
          title: Float
        spotPrice:
          type:
          - "null"
          - number
          format: float
          description: "Spot price in NOK/kWh. VAT is included except for metering\
            \ Points located in Troms, Finnmark and Nordland."
          title: Float
        startTime:
          type:
          - "null"
          - string
          description: The start time of the interval.
          title: String
        supportPrice:
          type:
          - "null"
          - number
          format: float
          description: "Support price in NOK/kWh. VAT is included except for metering\
            \ Points located in Troms, Finnmark and Nordland. After monthly treshold\
            \ is crossed OR price is lower than the support price upper bound, Support\
            \ price = Spot Price."
          title: Float
